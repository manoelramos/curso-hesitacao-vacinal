<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Curso Hesitação Vacinal - Módulo 1</title>
    <script>
        // Configura o caminho base dinamicamente
        (function() {
            const pathname = window.location.pathname;
            const basePath = pathname.substring(0, pathname.lastIndexOf('/') + 1);
            const base = document.createElement('base');
            base.href = basePath;
            document.head.insertBefore(base, document.head.firstChild);
        })();
    </script>
    <link rel="stylesheet" href="styles.css">
    <link rel="stylesheet" href="components.css">
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;500;700;800&display=swap" rel="stylesheet">
</head>
<body>
    <!-- Header -->
    <header class="header">
        <div class="header-banner"></div>
        <div class="header-content">
            <div class="module-info">
                <h1 class="module-number">MÓDULO 1</h1>
                <h2 class="module-title">Vacina e Vacinação</h2>
            </div>
        </div>
    </header>

    <aside class="sidebar">
        <div class="logo">
            <div class="logo-content">
                <img src="assets/logo-curso-hesitacao-vacinal.svg" alt="Curso Hesitação Vacinal" class="logo-image">
            </div>
        </div>

        <nav class="nav-menu">
            <div class="nav-item">
                <div class="nav-divider"></div>
                <a class="nav-link" href="apresentacao.html">
                    <svg class="nav-icon" width="16" height="16" viewBox="0 0 16 16" fill="none">
                        <path d="M2 6L8 2L14 6V14H10V10H6V14H2V6Z" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
                    </svg>
                    <span class="nav-text">Página Inicial</span>
                </a>
                <div class="nav-divider"></div>
            </div>
        </nav>

        <div class="course-steps" id="stepper-root">
            <!-- O stepper será renderizado dinamicamente aqui -->
        </div>

        <div class="additional-menu">
            <div class="nav-link">
                <svg class="nav-icon" width="16" height="16" viewBox="0 0 16 16" fill="none">
                    <path d="M4 2H12V14H4V2Z" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
                    <path d="M6 5H10M6 8H10M6 11H8" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
                </svg>
                <span class="nav-text">Créditos</span>
            </div>
            <div class="nav-divider"></div>
        </div>

        <div class="niesp-logo">
            <img src="assets/niesp.png" alt="NiESP" class="niesp-image">
        </div>
    </aside>

    <main class="main-content" id="content">
        <!-- O conteúdo será carregado dinamicamente aqui -->
    </main>

    <footer class="footer">
        <div class="footer-content">
            <div class="footer-section">
                <h3 class="footer-label">Apoio</h3>
                <div class="footer-logos-apoio">
                    <img src="assets/footer/logo-niesp.png" alt="NiESP" class="footer-logo-img">
                    <img src="assets/footer/logo-inova.png" alt="Inova Fiocruz" class="footer-logo-img">
                </div>
            </div>
            <div class="footer-section">
                <h3 class="footer-label">Realização</h3>
                <div class="footer-logos-realizacao">
                    <img src="assets/footer/logo-ensp.png" alt="ENSP" class="footer-logo-realizacao">
                    <img src="assets/footer/logo-campus.png" alt="Campus Virtual Fiocruz" class="footer-logo-realizacao">
                    <img src="assets/footer/logo-fiocruz.png" alt="Fiocruz" class="footer-logo-realizacao">
                    <img src="assets/footer/logo-sus.png" alt="SUS" class="footer-logo-realizacao">
                    <img src="assets/footer/logo-ms.png" alt="Ministério da Saúde" class="footer-logo-realizacao">
                    <img src="assets/footer/logo-me.png" alt="Ministério da Educação" class="footer-logo-realizacao">
                    <img src="assets/footer/logo-gov.png" alt="Governo do Brasil" class="footer-logo-realizacao">
                </div>
            </div>
        </div>
        <div class="footer-bottom"></div>
    </footer>
    <script src="scripts/main.js"></script>
</body>
</html>
